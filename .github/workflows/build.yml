# Build the project on every push and pull request, upload the jar as a
# workflow artifact, and publish a GitHub Release with the jar attached
# whenever a version tag (v*) is pushed.

name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # needed to create the release on tag pushes
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          # Gradle wrapper is 8.8 (supports up to Java 22) and the mod
          # targets Java 21, so build with 21 — same as local builds.
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: player-bot-jar
          path: build/libs/*.jar
      - name: publish release with jar
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
